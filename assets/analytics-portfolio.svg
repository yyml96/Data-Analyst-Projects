<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Data analytics portfolio</title>
  <desc id="desc">A visual overview of a data workflow across SQL, Python, and visualization, with a sample line chart and project metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101d36"/><stop offset="1" stop-color="#172b4a"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#83d6c5"/><stop offset="1" stop-color="#b7f078"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#081226" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1400" height="520" rx="30" fill="url(#bg)"/>
  <circle cx="1265" cy="60" r="220" fill="#314b6b" opacity=".25"/>
  <circle cx="1160" cy="485" r="175" fill="#83d6c5" opacity=".07"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="78" y="92" fill="#b7f078" font-size="18" font-weight="700" letter-spacing="3">DATA ANALYTICS PORTFOLIO</text>
    <text x="76" y="176" fill="#ffffff" font-size="57" font-weight="750">From raw data</text>
    <text x="76" y="242" fill="#ffffff" font-size="57" font-weight="750">to clear insight.</text>
    <text x="80" y="292" fill="#c2ccdb" font-size="21">Practical projects in querying, cleaning, analysis,</text>
    <text x="80" y="323" fill="#c2ccdb" font-size="21">and communicating data.</text>
    <g transform="translate(80 372)">
      <rect width="136" height="44" rx="22" fill="#263d5b"/><text x="68" y="28" text-anchor="middle" fill="#e8f1ff" font-size="15" font-weight="700" letter-spacing="1">SQL</text>
      <rect x="150" width="150" height="44" rx="22" fill="#263d5b"/><text x="225" y="28" text-anchor="middle" fill="#e8f1ff" font-size="15" font-weight="700" letter-spacing="1">PYTHON</text>
      <rect x="314" width="190" height="44" rx="22" fill="#263d5b"/><text x="409" y="28" text-anchor="middle" fill="#e8f1ff" font-size="15" font-weight="700" letter-spacing="1">VISUALIZATION</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="700" y="72" width="620" height="376" rx="22" fill="#f7f8f4"/>
      <text x="742" y="120" fill="#20314a" font-size="14" font-weight="700" letter-spacing="1.5">A REPEATABLE ANALYSIS WORKFLOW</text>
      <g transform="translate(742 148)">
        <rect width="164" height="52" rx="12" fill="#e8f0ed"/><text x="82" y="33" text-anchor="middle" fill="#20314a" font-size="16" font-weight="700">Collect</text>
        <path d="M171 26h28m-8-8 8 8-8 8" fill="none" stroke="#a4b1b8" stroke-width="2"/>
        <rect x="210" width="164" height="52" rx="12" fill="#eef0f8"/><text x="292" y="33" text-anchor="middle" fill="#20314a" font-size="16" font-weight="700">Clean</text>
        <path d="M381 26h28m-8-8 8 8-8 8" fill="none" stroke="#a4b1b8" stroke-width="2"/>
        <rect x="420" width="116" height="52" rx="12" fill="#f1f4e8"/><text x="478" y="33" text-anchor="middle" fill="#20314a" font-size="16" font-weight="700">Explain</text>
      </g>
      <text x="742" y="248" fill="#52627a" font-size="13" font-weight="700" letter-spacing="1.2">EXPLORE · COMPARE · COMMUNICATE</text>
      <g transform="translate(742 266)">
        <path d="M0 115H536M0 77H536M0 39H536M0 1H536" stroke="#dfe5e4" stroke-width="1"/>
        <path d="M12 99 C60 91 76 107 120 77 S191 73 225 55 S286 72 325 45 S392 62 429 22 S490 30 524 9" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
        <path d="M12 99 C60 91 76 107 120 77 S191 73 225 55 S286 72 325 45 S392 62 429 22 S490 30 524 9 L524 115 L12 115Z" fill="#83d6c5" opacity=".14"/>
        <circle cx="120" cy="77" r="5" fill="#2f776e"/><circle cx="325" cy="45" r="5" fill="#2f776e"/><circle cx="524" cy="9" r="5" fill="#2f776e"/>
      </g>
      <g transform="translate(742 405)">
        <circle cx="7" cy="0" r="5" fill="#84c6b4"/><text x="22" y="5" fill="#52627a" font-size="13">Data preparation</text>
        <circle cx="196" cy="0" r="5" fill="#a3c978"/><text x="211" y="5" fill="#52627a" font-size="13">Analysis</text>
        <circle cx="316" cy="0" r="5" fill="#dba47a"/><text x="331" y="5" fill="#52627a" font-size="13">Communication</text>
      </g>
    </g>
    <text x="80" y="474" fill="#91a1b7" font-size="13">SQL Server  ·  Python  ·  Excel  ·  Tableau</text>
  </g>
</svg>